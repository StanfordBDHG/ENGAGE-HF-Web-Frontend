name: Build and Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  eslint:
    name: ESLint
    uses: SchmiedmayerLab/.github/.github/workflows/eslint.yml@v0.5
    permissions:
      contents: read
      checks: write
  testandcoverage:
    name: Test and Coverage
    uses: SchmiedmayerLab/.github/.github/workflows/npm-test-coverage.yml@v0.5
    with:
      nodeVersionFile: package.json
    secrets:
      token: ${{ secrets.CODECOV_TOKEN }}
  endtoendtests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Build the backend
        run: npm --prefix ENGAGE-HF-Firebase run prepare
      - name: Run the end-to-end tests
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
